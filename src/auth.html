<style>
body { font-family: sans-serif; max-width: 500px; margin: 60px auto; text-align: center }
.card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin: 20px 0 }
.message { background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 8px; padding: 16px; margin: 20px 0; text-align: left; color: #0369a1 }
textarea { width: 100%; height: 100px; font-family: monospace; font-size: 14px; padding: 10px; box-sizing: border-box; border: 1px solid #dee2e6; border-radius: 6px; resize: none }
button { padding: 12px 32px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; margin: 8px; background: #2563eb; color: #fff }
button:hover { background: #1d4ed8 }
kbd { background: #e8e8e8; padding: 2px 6px; border-radius: 3px; font-size: 12px }
.success { color: #10b981; font-weight: bold; font-size: 18px }
.error { color: #ef4444; font-weight: bold }
.hint { color: #888; font-size: 13px }
</style>
<h2>Authentication</h2>
<? if (authMessage) { ?>
<div class="message"><?= authMessage ?></div>
<? } ?>
<div id="status"></div>
<div id="manual" class="card" style="text-align:left">
<textarea id="t" readonly onclick="this.select()"><?= token ?></textarea>
<div style="text-align:center;margin-top:12px">
<button onclick="var t=document.getElementById('t');t.focus();t.select();document.execCommand('copy');this.textContent='Copied!'">Copy Token</button>
</div>
<p class="hint" style="text-align:center">Click to copy, or select and press <kbd>Ctrl+C</kbd> / <kbd>Cmd+C</kbd></p>
</div>
<script>
(function() {
  document.getElementById('t').select();
  var token = document.getElementById('t').value;
  var callback = '<?= callback ?>';
  if (callback && token) {
    var status = document.getElementById('status');
    var manual = document.getElementById('manual');
    status.innerHTML = '<div class="card"><p>Sending token to daemon...</p></div>';
    manual.style.display = 'none';
    fetch(callback, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(function(res) {
      if (res.ok) {
        var feedbackUrl = '<?= feedbackUrl ?>';
        var feedbackHtml = feedbackUrl
          ? '<div style="margin-top:24px;padding-top:16px;border-top:1px solid #dee2e6"><p>Have feedback or suggestions? <a href="' + feedbackUrl + '" target="_blank" rel="noopener" style="color:#2563eb">Let us know</a></p></div>'
          : '';
        status.innerHTML = '<div class="card"><p class="success">&#10003; Complete</p><p>You can close this tab and return to the terminal.</p>' + feedbackHtml + '</div>';
      } else {
        status.innerHTML = '<div class="card"><p class="error">Failed to send token (HTTP ' + res.status + ')</p></div>';
        manual.style.display = '';
      }
    }).catch(function(err) {
      status.innerHTML = '<div class="card"><p class="error">Could not reach daemon</p></div>';
      manual.style.display = '';
    });
  }
})();
</script>
